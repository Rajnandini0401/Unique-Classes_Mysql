services:
  # ==========================================
  # 1. MySQL Relational Database
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: unique_classes_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-tuition_db}
      MYSQL_USER: ${DB_USER:-tuition_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tuition_password}
    volumes:
      - mysql_data:/var/lib/mysql
      # Auto-run SQL schema on first container initialization
      - ./server/scripts/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - unique_net

  # ==========================================
  # 2. Node.js Express REST API Backend
  # ==========================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: unique_classes_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-tuition_user}
      DB_PASSWORD: ${DB_PASSWORD:-tuition_password}
      DB_NAME: ${DB_NAME:-tuition_db}
      JWT_SECRET: ${JWT_SECRET:-unique_classes_jwt_secret_key_2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-askkmane@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-UCadmin}
    volumes:
      # Persistent student & faculty photo uploads mapped to host
      - ./server/uploads:/app/uploads
      - whatsapp_session:/app/whatsapp_session_data
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - unique_net

  # ==========================================
  # 3. React Vite SPA Frontend (Nginx)
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: unique_classes_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - unique_net

volumes:
  mysql_data:
    driver: local
  whatsapp_session:
    driver: local

networks:
  unique_net:
    driver: bridge
